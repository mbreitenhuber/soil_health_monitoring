###########################################
# CONFIGURATION
###########################################
stages:
  - prepare
  - build
  - deploy

variables:
  # Helm --atomic waits until resources are ready; slow pulls / probes need margin.
  HELM_TIMEOUT: 25m0s
  #
  # Generic helm chart from https://gitlab.inf.ethz.ch/ou-ivia/generic-helm-chart
  HELM_CHART: oci://${CI_REGISTRY}/ivia-generic-helm-chart/ivia-generic-helm-chart
  HELM_CHART_VERSION: 4.6.3
  # Harbor project (iviastudent), same layout as kubi-ivia apps like ivia-dashboard.
  CI_REGISTRY_IMAGE: ${CI_REGISTRY}/iviastudent/${CI_PROJECT_PATH}
  # Shared buildah layer cache for all student-projects under iviastudent.
  BUILD_CACHE: ${CI_REGISTRY}/iviastudent/ou-ivia/projects/student-projects/build-cache

default:
  tags:
    - ivialab-on-premise-cluster

###############################
# SETUP ENVIRONMENT VARIABLES #
###############################

export-environment:
  extends: .deploy-only-rules
  image:
    name: alpine:3.19.1
    entrypoint: [ "bash" ]
  stage: prepare
  script:
    - PROJECT_NAME_SHORTENED=$(echo -n ${CI_PROJECT_NAME} | cut -c 1-30 | tr / - | tr . - | tr _ - | tr '[:upper:]' '[:lower:]' | sed -E 's#-+$##')
    - URL_FRONTEND="agroscan.ivia.ch"
    - URL_BACKEND="be.agroscan.ivia.ch"
    - RELEASE_NAME="${PROJECT_NAME_SHORTENED}"
    # CI_REGISTRY must be the Harbor host only (e.g. harbor.ivia.ch), not a project path.
    - CI_REGISTRY="$(echo -n "${CI_REGISTRY%%/*}" | tr -d '\r\n')"
    - CI_REGISTRY_IMAGE="$(echo -n "${CI_REGISTRY}/iviastudent/${CI_PROJECT_PATH}" | tr '[:upper:]' '[:lower:]')"
    - BUILD_CACHE="$(echo -n "${CI_REGISTRY}/iviastudent/ou-ivia/projects/student-projects/build-cache" | tr '[:upper:]' '[:lower:]')"
    - echo "CI_REGISTRY=${CI_REGISTRY}" > .env
    - echo "CI_REGISTRY_IMAGE=${CI_REGISTRY_IMAGE}" >> .env
    - echo "BUILD_CACHE=${BUILD_CACHE}" >> .env
    - echo "RELEASE_NAME=${RELEASE_NAME}" >> .env
    - echo "URL_FRONTEND=${URL_FRONTEND}" >> .env
    - echo "URL_BACKEND=${URL_BACKEND}" >> .env
    - 'echo "Registry host:  ${CI_REGISTRY}"'
    - 'echo "Registry image: ${CI_REGISTRY_IMAGE}"'
    - 'echo "Release name:   ${RELEASE_NAME}"'
    - 'echo "Frontend URL:   ${URL_FRONTEND}"'
    - 'echo "Backend URL:    ${URL_BACKEND}"'
  artifacts:
    reports:
      dotenv: .env
    expire_in: 100 days


########################
# DEFINE TRIGGER RULES #
########################


.build-trigger-rules:
  rules:
    - if: >
        $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/**/*
      when: on_success
    - when: never

.deploy-only-rules:
  rules:
    - if: >
        $CI_COMMIT_BRANCH == "main"
      when: on_success


###########################################
# DOCKERIZE
###########################################

build:buildah:
  extends: .build-trigger-rules
  stage: build
  image:
    name: quay.io/buildah/stable:latest
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
    BUILDAH_LAYERS: "true"
  parallel:
    matrix:
      - APP_LAYER:
        - backend
  tags:
    - ivialab-on-premise-cluster
  timeout: 30m
  retry: 2
  before_script:
    # Same as ivia-dashboard: CI_REGISTRY_PASSWORD + stdin login to Harbor host.
    - |
      REGISTRY_PASSWORD="${CI_REGISTRY_PASSWORD:-${CI_REGISTRY_PWD:-}}"
      if [ -z "${REGISTRY_PASSWORD}" ]; then
        echo "ERROR: CI_REGISTRY_PASSWORD (or CI_REGISTRY_PWD) is not set."
        exit 1
      fi
      echo "${REGISTRY_PASSWORD}" | buildah login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
  script:
    # Only push the tag deploy uses (latest-<layer>).
    - IMAGE="${CI_REGISTRY_IMAGE}:latest-${APP_LAYER}"
    - >
      buildah bud
      --layers
      --cache-from "${BUILD_CACHE}"
      --cache-to "${BUILD_CACHE}"
      --file "./Dockerfile"
      --tag "${IMAGE}"
      "./${APP_LAYER}"
    - buildah push "${IMAGE}"


###########################################
# DEPLOY  (generic-helm-chart)
###########################################

.deploy-template:
  extends: .deploy-only-rules
  image:
    name: alpine/helm:3.14.1
    entrypoint: [ "bash" ]
  before_script:
    - |
      if [ -z "${DIRECT_KUBECONFIG:-}" ]; then
        echo "ERROR: DIRECT_KUBECONFIG is not set."
        exit 1
      fi
      if [ -z "${DIRECT_K8S_NAMESPACE:-}" ]; then
        echo "ERROR: DIRECT_K8S_NAMESPACE is not set."
        exit 1
      fi
      if [ -f "${DIRECT_KUBECONFIG}" ]; then
        export KUBECONFIG="${DIRECT_KUBECONFIG}"
      else
        mkdir -p "${CI_PROJECT_DIR}/.kube"
        printf '%s\n' "${DIRECT_KUBECONFIG}" > "${CI_PROJECT_DIR}/.kube/config"
        chmod 600 "${CI_PROJECT_DIR}/.kube/config"
        export KUBECONFIG="${CI_PROJECT_DIR}/.kube/config"
      fi
      export DIRECT_K8S_NAMESPACE="$(printf '%s' "${DIRECT_K8S_NAMESPACE}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
      echo "Using namespace: ${DIRECT_K8S_NAMESPACE}"
    - |
      REGISTRY_PASSWORD="${CI_REGISTRY_PASSWORD:-${CI_REGISTRY_PWD:-}}"
      if [ -z "${REGISTRY_PASSWORD}" ]; then
        echo "ERROR: CI_REGISTRY_PASSWORD (or CI_REGISTRY_PWD) is not set."
        exit 1
      fi
      echo "${REGISTRY_PASSWORD}" | helm registry login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"

deploy-app:
  extends: .deploy-template
  stage: deploy
  timeout: 35m
  script:
    - >
      helm upgrade
      ${RELEASE_NAME}
      ${HELM_CHART}
      --version ${HELM_CHART_VERSION}
      --namespace "${DIRECT_K8S_NAMESPACE}"
      --install
      --atomic
      -f "helm/values.yaml"
      --timeout "${HELM_TIMEOUT}"
      --set-string components.backend.image.repository="${CI_REGISTRY_IMAGE}"
      --set-string components.backend.image.tag="latest-backend"
      --set components.backend.ingress.url="${URL_BACKEND}"
  environment:
    url: https://$URL_BACKEND
    name: $CI_PROJECT_NAME/$CI_COMMIT_REF_SLUG
