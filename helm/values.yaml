components:

  backend:
    enabled: true
    updateStrategy: Recreate
    affinity:
      ivia.ch/nodetype: gpu
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/gpu
        operator: Exists
    image:
      repository: null  # set via --set in CI
      tag: latest
      pullPolicy: Always
    port: 8000
    health: /healthz
    extraEnv:
      AGROSCAN_API_URL: ""
      AGROSCAN_DB_PATH: /persistent-data/agroscan.db
      AGROSCAN_MODEL_PATH: /persistent-data
    ingress:
      enabled: true
      url: null  # set via --set in CI
    pvcs:
      - name: data
        mountPath: /persistent-data
        storageClassName: longhorn
        storage: "12G"
        accessMode: ReadWriteOnce
