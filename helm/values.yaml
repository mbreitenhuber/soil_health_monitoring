components:

  backend:
    enabled: true
    updateStrategy: Recreate

    # GPU scheduling (ivia-generic-helm-chart): requires gpu nodes, adds tolerations.
    requests:
      gpu: true

    image:
      repository: null  # set via --set in CI
      tag: latest
      pullPolicy: Always
    port: 8000
    health: /healthz
    extraEnv:
      AGROSCAN_API_URL: ""
      AGROSCAN_DB_PATH: /persistent-data/agroscan.db
      AGROSCAN_MODEL_PATH: /persistent-data
      DATASET_PATH: /persistent-data/datasets
      SENTINEL_DIR: /persistent-data/sentinel_output
      TMP_DIR: /persistent-data/tmp
    ingress:
      enabled: true
      url: null  # set via --set in CI
    pvcs:
      - name: data
        mountPath: /persistent-data
        storageClassName: longhorn
        storage: "12G"
        accessMode: ReadWriteOnce
