components:

  backend:
    enabled: true
    updateStrategy: Recreate

    # Pin to GTX 1080 Ti worker; no nvidia.com/gpu request (CPU-only inference).
    nodeSelector:
      kubernetes.io/hostname: k8s-ivia-no-42.inf.ethz.ch
    tolerations:
      - key: node-role.kubernetes.io/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    requests:
      memory: 4Gi
    limits:
      memory: 8Gi

    image:
      repository: null  # set via --set in CI
      tag: latest
      pullPolicy: Always
    port: 8000
    health: /healthz
    extraEnv:
      AGROSCAN_API_URL: ""
      AGROSCAN_DB_PATH: /persistent-db/agroscan.db
      AGROSCAN_MODEL_PATH: /persistent-data
      DATASET_PATH: /persistent-data/datasets
      SENTINEL_DIR: /persistent-data/sentinel_output
      TMP_DIR: /tmp/agroscan
      AGROSCAN_SENTINEL_API_THREADS: "2"
      AGROSCAN_SENTINEL_DOWNLOAD_THREADS: "4"
      AGROSCAN_SENTINEL_WORKER_THREADS: "8"
      AGROSCAN_SINGLE_SCENE: "true"
      AGROSCAN_TORCH_DEVICE: cpu
    emptyDirVolumes:
      - name: tmp
        mountPath: /tmp/agroscan
        medium: Memory
        sizeLimit: 2Gi
    ingress:
      enabled: true
      url: null  # set via --set in CI
      extraAnnotations: |
        nginx.org/client-max-body-size: "16m"
        nginx.org/proxy-read-timeout: "900s"
        nginx.org/proxy-send-timeout: "900s"
        nginx.org/proxy-connect-timeout: "900s"
        nginx.ingress.kubernetes.io/proxy-body-size: "16m"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
        nginx.ingress.kubernetes.io/proxy-connect-timeout: "900"
    pvcs:
      - name: data
        mountPath: /persistent-data
        storageClassName: longhorn
        storage: "150G"
        accessMode: ReadWriteOnce
      - name: db
        mountPath: /persistent-db
        storageClassName: longhorn
        storage: "1G"
        accessMode: ReadWriteOnce
