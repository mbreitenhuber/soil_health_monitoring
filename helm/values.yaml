components:

  backend:
    enabled: true
    image:
      repository: null  # set via --set in CI
      tag: latest
      pullPolicy: Always
    port: 8000
    health: /healthz
    extraEnv:
      AGROSCAN_MODEL_PATH: /data
    ingress:
      enabled: true
      url: null  # set via --set in CI
    pvcs:
      - name: data
        mountPath: /data
        storageClassName: longhorn
        storage: 5G
        accessMode: ReadWriteOnce
